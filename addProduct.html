<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>GS Analytics — Add Product</title>
    <link rel="icon" href="Images/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha384-PPIZEGYM1v8zp5Py7UjFb79S58UeqCL9pYVnVPURKEqvioPROaVAJKKLzvH2rDnI" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link href="https://fonts.googleapis.com/css?family=Raleway:300,400,500i,900,900i" rel="stylesheet">
    <link rel="stylesheet" href="CSS/Theme.css">
</head>
<body data-page="addProduct">
    <div class="app-shell">
        <nav class="sidebar" id="sidebar"></nav>
        <div class="app-main">
            <header class="topbar">
                <button id="navToggle" class="navToggle" aria-label="Toggle navigation"><i class="fa-solid fa-bars"></i></button>
                <h1 class="page-title">Add New Product</h1>
            </header>
            <main class="page-content">
                <div class="form-card">
                    <form id="productForm" novalidate>
                        <div class="ask">
                            <label class="Q" for="productName">Product Name</label>
                            <input class="in" type="text" id="productName" placeholder="Product Name" required>
                        </div>
                        <div class="ask">
                            <label class="Q" for="category">Category</label>
                            <select class="in" id="category" required>
                                <option disabled selected hidden value="">Select</option>
                                <option>Technology</option>
                                <option>Furniture</option>
                                <option>Office Supplies</option>
                            </select>
                        </div>
                        <button type="submit" class="btnSelect">Add Product</button>
                    </form>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="JS/api.js"></script>
    <script src="JS/auth.js"></script>
    <script src="JS/data.js"></script>
    <script src="JS/ui.js"></script>
    <script src="JS/nav.js"></script>
    <script>
      (async function () {
        await GSAuth.requireAuth();

        document.getElementById('productForm').addEventListener('submit', function (e) {
            e.preventDefault();
            var form = this;
            GSData.addProduct({
                name: document.getElementById('productName').value.trim(),
                category: document.getElementById('category').value
            }).then(function () {
                GSUI.showToast('Product added.');
                form.reset();
            }).catch(function (err) {
                GSUI.showToast(err.message || 'Could not add product.', true);
            });
        });
      })();
    </script>
</body>
</html>
