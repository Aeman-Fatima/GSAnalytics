# Local containerized dev environment only — this does not deploy anywhere. It mirrors the
# same app + Postgres pairing you'd run natively, just without installing Postgres yourself.
# Secrets (JWT_KEY, POSTGRES_PASSWORD) come from a local .env file that is gitignored; see
# .env.example for the variables you need to set before running `docker compose up`.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gsanalytics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gsanalytics
    ports:
      - "5432:5432"
    volumes:
      - gsanalytics-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gsanalytics"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__GSAnalytics: "Host=postgres;Database=gsanalytics;Username=gsanalytics;Password=${POSTGRES_PASSWORD}"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: GSAnalytics.Api
      Jwt__Audience: GSAnalytics.Frontend
      Cors__AllowedOrigins__0: "http://localhost:3000"
      Cors__AllowedOrigins__1: "http://localhost:5500"
    ports:
      - "8080:8080"

volumes:
  gsanalytics-postgres-data:
