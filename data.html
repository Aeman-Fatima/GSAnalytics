<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>GS Analytics — Data</title>
    <link rel="icon" href="Images/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha384-PPIZEGYM1v8zp5Py7UjFb79S58UeqCL9pYVnVPURKEqvioPROaVAJKKLzvH2rDnI" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link href="https://fonts.googleapis.com/css?family=Raleway:300,400,500i,900,900i" rel="stylesheet">
    <link rel="stylesheet" href="CSS/Theme.css">
    <style>
        #editModal .modal-content{ max-width: 480px; }
    </style>
</head>
<body data-page="data">
    <div class="app-shell">
        <nav class="sidebar" id="sidebar"></nav>
        <div class="app-main">
            <header class="topbar">
                <button id="navToggle" class="navToggle" aria-label="Toggle navigation"><i class="fa-solid fa-bars"></i></button>
                <h1 class="page-title">Data</h1>
            </header>
            <main class="page-content">
                <div class='search'>
                    <input id="searchInput" name='search' type='text' class='searchTerm' placeholder='What are you looking for?' aria-label="Search records">
                    <button type='button' class='searchButton'><img class="searchIcon" src='Images/filter.png' alt=""/></button>
                </div>
                <p class="note">Click a row to select it, then use Delete or Edit below.</p>
                <div class="table-card">
                    <div class="table-scroll">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Order Date</th><th>Customer</th><th>Product(s)</th>
                                    <th>City</th><th class="num">Total</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody"></tbody>
                        </table>
                    </div>
                </div>
                <div class="float-right">
                    <div class="buttons">
                        <a href="addRecord.html" class="btnSelect">Add Record</a>
                        <button type="button" class="btnSelect" id="deleteBtn">Delete Record</button>
                        <button type="button" class="btnSelect" id="editBtn">Edit Record</button>
                        <button type="button" class="btnSelect" id="exportBtn">Export CSV</button>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close" id="closeModal">&times;</span>
            <h3 style="color:var(--ink-primary); margin-top:0;">Edit Record</h3>
            <form id="editForm">
                <div class="ask"><label class="Q" for="editOrderDate">Order Date</label><input type="date" class="in" id="editOrderDate" required></div>
                <div class="ask" id="editCustomerWrp"><label class="Q" for="editCustomer">Customer</label><select class="in" id="editCustomer" required></select></div>
                <div class="ask" id="editProductWrp"><label class="Q" for="editProduct">Product</label><select class="in" id="editProduct" required></select></div>
                <div class="ask"><label class="Q" for="editCity">City</label><input type="text" class="in" id="editCity" required></div>
                <div class="ask" id="editSalesWrp"><label class="Q" for="editSales">Sales</label><input type="number" step="0.01" min="0.01" class="in" id="editSales" required></div>
                <p class="note" id="editMultiItemNote" style="display:none;">This order has multiple line items — only its date and city can be edited here.</p>
                <button type="submit" class="btnSelect">Save Changes</button>
            </form>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="JS/api.js"></script>
    <script src="JS/auth.js"></script>
    <script src="JS/data.js"></script>
    <script src="JS/ui.js"></script>
    <script src="JS/nav.js"></script>
    <script>
      (async function () {
        await GSAuth.requireAuth();

        var allCustomers = [];
        var allProducts = [];
        var sales = [];
        var selectedId = null;

        function productSummary(sale) {
            if (sale.items.length === 0) return '';
            if (sale.items.length === 1) return sale.items[0].productName;
            return sale.items[0].productName + ' + ' + (sale.items.length - 1) + ' more';
        }

        function renderTable(list) {
            document.getElementById('tableBody').innerHTML = list.map(function (r) {
                var selectedClass = r.id === selectedId ? ' row-selected' : '';
                return '<tr class="row-selectable' + selectedClass + '" data-id="' + r.id + '">' +
                    '<td>' + r.orderDate + '</td><td>' + r.customerName + '</td><td>' + productSummary(r) + '</td>' +
                    '<td>' + r.city + '</td><td class="num">' + r.total.toFixed(2) + '</td></tr>';
            }).join('') || '<tr><td colspan="5">No records match your search.</td></tr>';

            document.querySelectorAll('#tableBody tr[data-id]').forEach(function (row) {
                row.addEventListener('click', function () {
                    selectedId = row.getAttribute('data-id');
                    renderTable(currentList());
                });
            });
        }

        function currentList() {
            var term = document.getElementById('searchInput').value.toLowerCase();
            if (!term) return sales;
            return sales.filter(function (r) {
                return (r.orderDate + ' ' + r.customerName + ' ' + productSummary(r) + ' ' + r.city).toLowerCase().indexOf(term) !== -1;
            });
        }

        async function reload() {
            sales = await GSData.getSales();
            renderTable(currentList());
        }

        var results = await Promise.all([GSData.getCustomers(), GSData.getProducts(), GSData.getSales()]);
        allCustomers = results[0];
        allProducts = results[1];
        sales = results[2];
        renderTable(sales);

        document.getElementById('searchInput').addEventListener('input', function () { renderTable(currentList()); });

        document.getElementById('deleteBtn').addEventListener('click', function () {
            if (selectedId === null) { GSUI.showToast('Select a row first.', true); return; }
            GSData.deleteSale(selectedId).then(function () {
                selectedId = null;
                return reload();
            }).then(function () {
                GSUI.showToast('Record deleted.');
            }).catch(function (err) {
                GSUI.showToast(err.message || 'Could not delete record.', true);
            });
        });

        var editModal = document.getElementById('editModal');
        document.getElementById('editBtn').addEventListener('click', function () {
            if (selectedId === null) { GSUI.showToast('Select a row first.', true); return; }
            var sale = sales.find(function (r) { return r.id === selectedId; });
            var singleItem = sale.items.length === 1;

            document.getElementById('editOrderDate').value = sale.orderDate;
            document.getElementById('editCity').value = sale.city;
            document.getElementById('editCustomerWrp').style.display = singleItem ? '' : 'none';
            document.getElementById('editProductWrp').style.display = singleItem ? '' : 'none';
            document.getElementById('editSalesWrp').style.display = singleItem ? '' : 'none';
            document.getElementById('editMultiItemNote').style.display = singleItem ? 'none' : '';

            if (singleItem) {
                var customerSelect = document.getElementById('editCustomer');
                customerSelect.innerHTML = allCustomers.map(function (c) { return '<option value="' + c.id + '">' + c.name + '</option>'; }).join('');
                customerSelect.value = sale.customerId;

                var productSelect = document.getElementById('editProduct');
                productSelect.innerHTML = allProducts.map(function (p) { return '<option value="' + p.id + '">' + p.name + '</option>'; }).join('');
                productSelect.value = sale.items[0].productId;

                document.getElementById('editSales').value = sale.items[0].unitPrice;
            }

            editModal.style.display = 'block';
        });
        document.getElementById('closeModal').addEventListener('click', function () { editModal.style.display = 'none'; });
        window.addEventListener('click', function (e) { if (e.target === editModal) editModal.style.display = 'none'; });

        document.getElementById('editForm').addEventListener('submit', function (e) {
            e.preventDefault();
            var sale = sales.find(function (r) { return r.id === selectedId; });
            var singleItem = sale.items.length === 1;
            var orderDate = document.getElementById('editOrderDate').value;
            var city = document.getElementById('editCity').value.trim();

            var save = singleItem
                ? GSData.updateSingleItemSale(sale.id, {
                    customerId: document.getElementById('editCustomer').value,
                    productId: document.getElementById('editProduct').value,
                    orderDate: orderDate,
                    city: city,
                    sales: parseFloat(document.getElementById('editSales').value) || 0
                })
                : GSData.updateSaleDateAndCity(sale, orderDate, city);

            save.then(function () {
                editModal.style.display = 'none';
                return reload();
            }).then(function () {
                GSUI.showToast('Record updated.');
            }).catch(function (err) {
                GSUI.showToast(err.message || 'Could not update record.', true);
            });
        });

        document.getElementById('exportBtn').addEventListener('click', function () {
            GSUI.downloadCsv('gs-analytics-records.csv', currentList(), [
                { key: 'orderDate', label: 'Order Date' }, { key: 'customerName', label: 'Customer Name' },
                { key: 'city', label: 'City' }, { key: 'total', label: 'Total' }
            ]);
        });
      })();
    </script>
</body>
</html>
