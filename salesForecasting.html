<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>GS Analytics — Sales Forecast</title>
    <link rel="icon" href="Images/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha384-PPIZEGYM1v8zp5Py7UjFb79S58UeqCL9pYVnVPURKEqvioPROaVAJKKLzvH2rDnI" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link href="https://fonts.googleapis.com/css?family=Raleway:300,400,500i,900,900i" rel="stylesheet">
    <link rel="stylesheet" href="CSS/Theme.css">
</head>
<body data-page="forecast">
    <div class="app-shell">
        <nav class="sidebar" id="sidebar"></nav>
        <div class="app-main">
            <header class="topbar">
                <button id="navToggle" class="navToggle" aria-label="Toggle navigation"><i class="fa-solid fa-bars"></i></button>
                <h1 class="page-title">Sales Forecast</h1>
            </header>
            <main class="page-content">
                <div class="chart-card">
                    <h2>Monthly Sales — Actual and Projected</h2>
                    <canvas id="forecastChart"></canvas>
                    <p class="note"><i class="fa-solid fa-circle-info"></i> The dashed line is a simple linear trend line fitted to the demo data's monthly totals — a rough illustration, not a statistical forecasting model.</p>
                </div>

                <div class="table-card">
                    <div class="table-scroll">
                        <table class="table">
                            <thead><tr><th>Month</th><th class="num">Total Sales</th><th>Type</th></tr></thead>
                            <tbody id="forecastBody"></tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js" integrity="sha384-XcdcwHqIPULERb2yDEM4R0XaQKU3YnDsrTmjACBZyfdVVqjh6xQ4/DCMd7XLcA6Y" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="JS/api.js"></script>
    <script src="JS/auth.js"></script>
    <script src="JS/data.js"></script>
    <script src="JS/palette.js"></script>
    <script src="JS/ui.js"></script>
    <script src="JS/nav.js"></script>
    <script>
      (async function () {
        await GSAuth.requireAuth();

        Chart.defaults.font.family = "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif";
        Chart.defaults.color = GS_PALETTE.ink;
        Chart.defaults.borderColor = GS_PALETTE.grid;

        var records = await GSData.getRecords();
        var monthly = GSData.monthly(records);
        if (monthly.length === 0) {
            document.querySelector('.page-content').innerHTML = '<p class="note">Add some sales records to see a forecast.</p>';
            return;
        }
        var futurePeriods = 3;
        var projected = GSData.forecast(monthly.map(function (m) { return m.total; }), futurePeriods);

        function nextMonthLabel(label, offset) {
            var parts = label.split('-').map(Number);
            var date = new Date(parts[0], parts[1] - 1 + offset, 1);
            return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0');
        }
        var lastMonth = monthly[monthly.length - 1].month;
        var futureLabels = [];
        for (var i = 1; i <= futurePeriods; i++) futureLabels.push(nextMonthLabel(lastMonth, i));

        var allLabels = monthly.map(function (m) { return m.month; }).concat(futureLabels);
        var actualData = monthly.map(function (m) { return m.total; }).concat(futureLabels.map(function () { return null; }));
        var forecastData = monthly.map(function () { return null; });
        forecastData[forecastData.length - 1] = monthly[monthly.length - 1].total;
        forecastData = forecastData.concat(projected);

        new Chart(document.getElementById('forecastChart'), {
            type: 'line',
            data: {
                labels: allLabels,
                datasets: [
                    { label: 'Actual', data: actualData, borderColor: GS_PALETTE.brand, backgroundColor: GS_PALETTE.brand + '1f', fill: true, tension: 0.25, borderWidth: 2, pointRadius: 3 },
                    { label: 'Projected', data: forecastData, borderColor: GS_PALETTE.accent, borderDash: [6, 4], fill: false, tension: 0.25, borderWidth: 2, pointRadius: 3 }
                ]
            },
            options: { responsive: true, scales: { y: { grid: { color: GS_PALETTE.grid } }, x: { grid: { display: false } } } }
        });

        var rows = monthly.map(function (m) { return { month: m.month, total: m.total, type: 'Actual' }; })
            .concat(futureLabels.map(function (m, idx) { return { month: m, total: projected[idx], type: 'Projected' }; }));
        document.getElementById('forecastBody').innerHTML = rows.map(function (r) {
            return '<tr><td>' + r.month + '</td><td class="num">$' + r.total.toFixed(2) + '</td><td>' + r.type + '</td></tr>';
        }).join('');
      })();
    </script>
</body>
</html>
