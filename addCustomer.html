<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>GS Analytics — Add Customer</title>
    <link rel="icon" href="Images/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha384-PPIZEGYM1v8zp5Py7UjFb79S58UeqCL9pYVnVPURKEqvioPROaVAJKKLzvH2rDnI" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link href="https://fonts.googleapis.com/css?family=Raleway:300,400,500i,900,900i" rel="stylesheet">
    <link rel="stylesheet" href="CSS/Theme.css">
    <link rel="stylesheet" href="CSS/add.css">
</head>
<body data-page="addCustomer">
    <script>if (sessionStorage.getItem('gsa.session') !== '1') { window.location.replace('index.html'); }</script>

    <button id="navToggle" class="navToggle" aria-label="Toggle navigation"><i class="fa-solid fa-bars"></i></button>
    <div class="sidenav"></div>
    <nav class="sidenav2" id="sidenav2"></nav>

    <header class="fluid-container center topbar">
        <div class="row align-items-center">
            <div class="col-md-3">
                <img src="Images/logo.png" class="logo" alt="GS Analytics logo"/>
            </div>
            <div class="col-md-6">
                <span class="vertical-middle">Add New Customer</span>
            </div>
            <div class="col-md-3">
                <span class="uprTxt" data-user></span>
                <a href="#" class="uprTxt" data-action="logout" style="margin-left:10px;">Logout</a>
            </div>
        </div>
    </header>

    <main class="fluid-container center">
        <div class="container main-body">
            <div class="container">
                <form id="customerForm" novalidate>
                    <div class="row ask">
                        <div class="col-md-6"><label class="Q" for="customerId">Customer ID:</label></div>
                        <div class="col-md-6">
                            <input class="in" type="text" id="customerId" pattern="[A-Za-z]{2}-\d{5}" placeholder="AA-00000" required>
                            <div class="form-error" id="idError">Use the format AA-00000.</div>
                        </div>
                    </div>
                    <div class="row ask">
                        <div class="col-md-6"><label class="Q" for="customerName">Customer Name:</label></div>
                        <div class="col-md-6"><input class="in" type="text" id="customerName" placeholder="Customer Name" required></div>
                    </div>
                    <div class="row ask">
                        <div class="col-md-6"><label class="Q" for="segment">Segment:</label></div>
                        <div class="col-md-6">
                            <select class="in" id="segment" required>
                                <option class="select" disabled selected hidden value="">Select</option>
                                <option>Consumer</option>
                                <option>Corporate</option>
                                <option>Home Office</option>
                            </select>
                        </div>
                    </div>
                    <div class="row ask">
                        <div class="col-md-6"></div>
                        <div class="col-md-6"><button type="submit" class="btn btnSelect">Add Customer</button></div>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="JS/auth.js"></script>
    <script src="JS/data.js"></script>
    <script src="JS/ui.js"></script>
    <script src="JS/nav.js"></script>
    <script>
        document.getElementById('customerForm').addEventListener('submit', function (e) {
            e.preventDefault();
            var id = document.getElementById('customerId').value.trim().toUpperCase();
            var idError = document.getElementById('idError');
            if (!/^[A-Za-z]{2}-\d{5}$/.test(id)) { idError.classList.add('show'); return; }
            idError.classList.remove('show');

            var existing = GSData.getCustomers();
            if (existing.some(function (c) { return c.id === id; })) {
                GSUI.showToast('A customer with that ID already exists.', true);
                return;
            }

            GSData.addCustomer({
                id: id,
                name: document.getElementById('customerName').value.trim(),
                segment: document.getElementById('segment').value
            });
            GSUI.showToast('Customer added.');
            this.reset();
        });
    </script>
</body>
</html>
