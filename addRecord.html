<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>GS Analytics — Add Record</title>
    <link rel="icon" href="Images/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha384-PPIZEGYM1v8zp5Py7UjFb79S58UeqCL9pYVnVPURKEqvioPROaVAJKKLzvH2rDnI" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link href="https://fonts.googleapis.com/css?family=Raleway:300,400,500i,900,900i" rel="stylesheet">
    <link rel="stylesheet" href="CSS/Theme.css">
</head>
<body data-page="addRecord">
    <div class="app-shell">
        <nav class="sidebar" id="sidebar"></nav>
        <div class="app-main">
            <header class="topbar">
                <button id="navToggle" class="navToggle" aria-label="Toggle navigation"><i class="fa-solid fa-bars"></i></button>
                <h1 class="page-title">Add New Record</h1>
            </header>
            <main class="page-content">
                <div class="form-card">
                    <form id="recordForm" novalidate>
                        <div class="ask">
                            <label class="Q" for="orderDate">Date</label>
                            <input type="date" class="in" id="orderDate" required>
                        </div>

                        <div class="ask">
                            <label class="Q" for="customerId">Customer</label>
                            <select class="in" id="customerId" required>
                                <option disabled selected hidden value="">Select a customer</option>
                            </select>
                        </div>

                        <div class="ask">
                            <label class="Q" for="productId">Product</label>
                            <select class="in" id="productId" required>
                                <option disabled selected hidden value="">Select a product</option>
                            </select>
                        </div>

                        <div class="ask">
                            <label class="Q" for="city">City</label>
                            <input class="in" type="text" id="city" list="cityOptions" placeholder="City" required>
                            <datalist id="cityOptions"></datalist>
                        </div>

                        <div class="ask">
                            <label class="Q" for="sales">Sales</label>
                            <input class="in" type="number" step="0.01" min="0.01" id="sales" placeholder="Sales" required>
                        </div>

                        <button type="submit" class="btnSelect">Add Record</button>
                    </form>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="JS/api.js"></script>
    <script src="JS/auth.js"></script>
    <script src="JS/data.js"></script>
    <script src="JS/ui.js"></script>
    <script src="JS/nav.js"></script>
    <script>
      (async function () {
        await GSAuth.requireAuth();

        var results = await Promise.all([GSData.getCustomers(), GSData.getProducts()]);
        var customers = results[0], products = results[1];
        var cities = GSData.getCities();

        var customerSelect = document.getElementById('customerId');
        customers.forEach(function (c) {
            var opt = document.createElement('option');
            opt.value = c.id;
            opt.textContent = c.name + (c.segment ? ' — ' + c.segment : '');
            customerSelect.appendChild(opt);
        });

        var productSelect = document.getElementById('productId');
        products.forEach(function (p) {
            var opt = document.createElement('option');
            opt.value = p.id;
            opt.textContent = p.name + (p.category ? ' — ' + p.category : '');
            productSelect.appendChild(opt);
        });

        var cityOptions = document.getElementById('cityOptions');
        cities.forEach(function (city) {
            var opt = document.createElement('option');
            opt.value = city;
            cityOptions.appendChild(opt);
        });

        document.getElementById('orderDate').valueAsDate = new Date();

        document.getElementById('recordForm').addEventListener('submit', function (e) {
            e.preventDefault();
            var form = this;
            var customer = customers.find(function (c) { return c.id === customerSelect.value; });
            var product = products.find(function (p) { return p.id === productSelect.value; });
            if (!customer || !product) { GSUI.showToast('Select a customer and product.', true); return; }

            GSData.addRecord({
                orderDate: document.getElementById('orderDate').value,
                customerId: customer.id,
                productId: product.id,
                city: document.getElementById('city').value.trim(),
                sales: parseFloat(document.getElementById('sales').value) || 0
            }).then(function () {
                GSUI.showToast('Record added.');
                form.reset();
                document.getElementById('orderDate').valueAsDate = new Date();
            }).catch(function (err) {
                GSUI.showToast(err.message || 'Could not add record.', true);
            });
        });
      })();
    </script>
</body>
</html>
